name: daily-keep
on:
  schedule:
    - cron: "30 23 * * *"   # 06:30 JKT
    - cron: "30 9 * * *"    # 16:30 JKT
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write   # needed by the keepalive step
jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      # GitHub disables scheduled workflows after 60 days with no commits to this repo.
      # The keeper commits to streak-log, not to this repo.
      # A call to the enable endpoint resets the 60-day timer.
      - name: Keep workflow enabled
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-keep.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4            # streak-keeper itself
      - uses: actions/checkout@v4            # the commit target
        with:
          repository: jokot/streak-log
          token: ${{ secrets.STREAK_PAT }}
          path: streak-log
      - run: |
          git config user.name  "jokot"
          git config user.email "25982672+jokot@users.noreply.github.com"
        working-directory: streak-log
      - run: python keeper.py --repo streak-log
        env:
          GH_TOKEN: ${{ secrets.STREAK_PAT }}